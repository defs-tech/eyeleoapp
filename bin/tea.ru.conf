# Расписание чаёв EyeLeo
#
# Это тот файл, который ставит установщик. При первом запуске EyeLeo копирует его в
#   %APPDATA%\EyeLeo\tea.conf
# и читает именно эту копию, её и надо править. Изменения в этом файле внутри Program Files
# после первого копирования ни на что не влияют, да и править в Program Files не следует.
#
# Формат, по одному чаю в строке:
#   имя, температура в градусах, затем по одному времени на пролив, целыми секундами,
#   и по желанию en="..." и ru="..." — как чай называется в меню
#
# Меню строится из этого файла, в его порядке. Удалили строку — чай исчез из меню,
# добавили — появился. Отдельного списка в программе больше нет.
#
# Имя это всё, что определяет чай. Оно же имя файла его картинки,
#   Resources\tea_<имя>.png
# поэтому чаю, добавленному сюда, нужна своя картинка: без неё он всё равно заваривается,
# просто без чашки.
#
# КУДА ИДЁТ ЭТОТ ФАЙЛ. Не рядом с этим файлом: этот файл у вас в профиле, а картинки лежат
# с программой. Это папка Resources рядом с EyeLeo.exe, рядом с папками Langpacks и Personages:
#
#   C:\Program Files\EyeLeo\Resources\tea_milky_oolong.png
#
# В Program Files нельзя писать без прав администратора, поэтому либо запустите текстовый
# редактор от имени администратора, либо перенесите всю папку EyeLeo туда, куда можно писать.
# Программа грузит картинки относительно своей папки и ей всё равно, какая это папка.
#
# Самый простой способ получить правильный файл — скопировать уже готовый:
#
#   copy "C:\Program Files\EyeLeo\Resources\tea_green.png" ^
#         "C:\Program Files\EyeLeo\Resources\tea_milky_oolong.png"
#
# Какой должна быть картинка: PNG, 8 бит на образец, тип цвета 6, чтобы был настоящий
# альфа-канал, и не больше 71x44 пикселей. Копия готовой уже такой и является. Остальное
# проверяется при загрузке и отбрасывается, если не подошло: слот для стакана останется
# пустым, а не будет нарисовано что-то не то.
#
# Какой должно быть имя:
#   * одно слово латиницей в нижнем регистре, без пробелов
#   * буквы, цифры и подчёркивание, начиная с буквы
#   * не длиннее 24 символов
# Верхний регистр не сворачивается, а отвергается: Windows считает Tea.png и tea.png одним
# и тем же файлом, и имя, отличающееся только регистром, молча подхватило бы чужую картинку.
#
# Температура должна быть числом больше 0 и до 100. Она попадает только в подпись,
# по ней ничего не засекается.
#
# От 1 до 8 проливов на чай, каждый целым числом секунд от 1 до 3600. Восемь — не
# произвольное ограничение, это длиннейшее расписание из поставляемых, пуэра.
#
# Подписи в меню необязательны, на любом языке или сразу на обоих. Чай без подписей
# показывается под своим именем из этого файла. Эта сборка знает только en и ru; подпись на
# другом языке игнорируется, а сам чай всё равно появляется. Подпись пишется в кавычках,
# потому что в ней может быть запятая.
#
# Файл читается как UTF-8, поэтому подписи выше можно писать на любом языке.
#
# Воды здесь нет и добавить её нельзя: у неё нет расписания заваривания. Это напоминание
# о воде, у него свои настройки и свой стакан.
#
# Пустые строки и строки, начинающиеся с #, игнорируются. Нечитаемая строка отвергается
# целиком, причина уходит в журнал, остальной файл по-прежнему используется. Только файл,
# в котором нет вообще ничего пригодного, переходит на встроенные расписания, и тогда
# журнал скажет и об этом.
#
# Чтобы увидеть отказы, запустите EyeLeo с EYELEO_DEBUG=1:
#     set EYELEO_DEBUG=1 && EyeLeo.exe
#
# Изменили строку — перезапустите EyeLeo.

green, 80, 10, 15, 20, 25, 30, 35, en="Green tea", ru="Зелёный чай"
white, 85, 10, 15, 20, 25, 30, en="White tea", ru="Белый чай"
oolong, 85, 15, 25, 35, 45, 60, 75, en="Oolong", ru="Улун"
black, 90, 20, 30, 40, 50, 60, 70, en="Black tea", ru="Чёрный чай"
red, 95, 7, 10, 15, 20, 25, 30, en="Red tea", ru="Красный чай"
puer, 99, 20, 30, 40, 50, 60, 70, 80, 90, en="Pu-erh", ru="Пуэр"
herbal, 100, 300, 360, 420, 480, en="Herbal tea", ru="Травяной чай"
