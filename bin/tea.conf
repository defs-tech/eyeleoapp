# EyeLeo tea schedules
#
# This file is the one the installer ships. On the first run EyeLeo copies it into
#   %APPDATA%\EyeLeo\tea.conf
# and that copy is the file it actually reads, and the one to edit. Changes made to this
# file under Program Files have no effect after that first copy, and Program Files is not a
# sensible place to edit anyway.
#
# Format, one tea per line:
#   name, temperature in C, then one time per steep, in whole seconds
#
# The menu is built from this file, in this order. Delete a line and that tea is gone from
# the menu; add one and it turns up. There is no separate list anywhere else in the program.
#
# The name is the tea's whole identity. It is also the name of its picture file,
#   Resources\tea_<name>.png
# so a tea added here needs a picture of its own to look right: without one it still brews,
# it just has no cup.
#
# What a name has to be:
#   * one lowercase Latin word, no spaces
#   * letters, digits and underscores, starting with a letter
#   * at most 24 characters
# Uppercase is refused rather than folded, because Windows treats Tea.png and tea.png as one
# file and a name differing only in case would quietly pick up another tea's picture.
#
# The temperature has to be a number over 0 and up to 100. It only ever appears in the
# caption; nothing is timed by it.
#
# Between 1 and 8 steeps per tea, each a whole number of seconds from 1 to 3600. Eight is
# not an arbitrary limit, it is the longest schedule that ships, puer's.
#
# Water is not here and cannot be added: it has no steeping schedule. It is the hydration
# reminder, with its own settings and its own glass.
#
# Blank lines and lines starting with # are ignored. A line that cannot be read is refused
# whole, and the reason goes to the log. The rest of the file is still used. Only a file
# with nothing usable in it at all falls back to the built-in schedules, and then the log
# says so too.
#
# To see the refusals, launch EyeLeo with EYELEO_DEBUG=1 set:
#     set EYELEO_DEBUG=1 && EyeLeo.exe
#
# Change a line and restart EyeLeo.

green, 80, 10, 15, 20, 25, 30, 35
white, 85, 10, 15, 20, 25, 30
oolong, 85, 15, 25, 35, 45, 60, 75
black, 90, 20, 30, 40, 50, 60, 70
red, 95, 7, 10, 15, 20, 25, 30
puer, 99, 20, 30, 40, 50, 60, 70, 80, 90
herbal, 100, 300, 360, 420, 480