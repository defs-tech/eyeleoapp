# EyeLeo tea schedules
#
# This file is the one the installer ships. On the first run EyeLeo copies it into
#   %APPDATA%\EyeLeo\tea.conf
# and that copy is the file it actually reads, and the one to edit. Changes made to this
# file under Program Files have no effect after that first copy, and Program Files is not a
# sensible place to edit anyway.
#
# Format, one tea per line:
#   name, temperature in C, then the seconds for each steep
#
# Names are accepted in English or Russian, case does not matter:
#   green      зеленый  зелёный
#   white      белый
#   oolong     oolon    улун
#   black      чёрный   черный
#   puer       pu-er    пуэр
#   herbal     травяной grass
#
# Water has no schedule: it is a drink, not something you steep.
#
# Blank lines and lines starting with # are ignored. A line that cannot be read is skipped
# and that tea keeps its built-in schedule, so a typo costs one tea rather than all six.
# A steep of zero or less is dropped, since it would leave the countdown stuck at zero.
#
# The temperature only ever appears in the caption; nothing is timed by it.
#
# Change a line and restart EyeLeo.

green, 80, 10, 15, 20, 25, 30, 35
white, 85, 10, 15, 20, 25, 30
oolong, 85, 15, 25, 35, 45, 60, 75
black, 90, 20, 30, 40, 50, 60, 70
red, 95, 7, 10, 15, 20, 25, 30
puer, 99, 20, 30, 40, 50, 60, 70, 80, 90
herbal, 100, 300, 360, 420, 480
