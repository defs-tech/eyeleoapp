name: Build EyeLeo

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/**
    # A tag is what publishes a release: the installer and the release assets are only built for one,
    # so every ordinary push stays a plain compile-and-verify.
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      - name: Cache wxWidgets
        id: cache-wx
        uses: actions/cache@v4
        with:
          path: C:\Dev\wxWidgets-3.1.3
          # ВНИМАНИЕ: Я изменил имя кэша (добавил -md), чтобы сбросить старую версию
          key: wxwidgets-3.1.3-msvc2022-x64-md

      - name: Download and setup wxWidgets
        if: steps.cache-wx.outputs.cache-hit != 'true'
        run: |
          mkdir C:\Dev
          curl.exe -L -o C:\Dev\wxWidgets.zip https://github.com/wxWidgets/wxWidgets/releases/download/v3.1.3/wxWidgets-3.1.3.zip
          7z x C:\Dev\wxWidgets.zip -oC:\Dev\wxWidgets-3.1.3
        shell: cmd

      - name: Build wxWidgets
        if: steps.cache-wx.outputs.cache-hit != 'true'
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd /d C:\Dev\wxWidgets-3.1.3\build\msw
          # ВНИМАНИЕ: Изменено на RUNTIME_LIBS=dynamic
          nmake -f makefile.vc BUILD=release SHARED=0 RUNTIME_LIBS=dynamic TARGET_CPU=X64
        shell: cmd

      - name: Configure and Build EyeLeo App
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set WXWIN=C:\Dev\wxWidgets-3.1.3\
          cmake -B windowsbuild . > build.log 2>&1 && cmake --build windowsbuild --config Release >> build.log 2>&1
          set RC=%ERRORLEVEL%
          type build.log
          echo "### Build output" >> %GITHUB_STEP_SUMMARY%
          type build.log >> %GITHUB_STEP_SUMMARY%
          exit /b %RC%
        shell: cmd

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      # The installers only when a tag is pushed. NSIS 3.10 is already on the image; NSIS 3 rather than
      # 2 is required because the uninstaller section uses the FindProcDLL plugin to notice a running
      # EyeLeo. makensis is invoked directly on the .nsi and not through bin/make_installer_*.bat: those
      # copy config.*.xml over the tracked config.xml and then try to copy a manifest file the repository
      # does not have. The .nsi already renames the config on the way in with /oname.
      - name: Build the installers
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir dist
          cd bin
          rem Not on PATH: bin/make_installer_*.bat calls it by absolute path, so the image does not
          rem put it there.
          rem No /O here: makensis has no such option, it only understands /OUTFILE. Passed anyway it
          rem reads as the start of /OUTFILE or /LOG and fails with a complaint about the log file,
          rem which says nothing about the real cause. Each script's own OutFile decides the name, and
          rem the result is moved afterwards.
          rem Output is kept in a file so a failure can be read without job log rights.
          "C:\Program Files (x86)\NSIS\makensis.exe" EyeLeo.nsi > ..\nsis.log 2>&1
          if errorlevel 1 exit /b 1
          "C:\Program Files (x86)\NSIS\makensis.exe" EyeLeo_ru.nsi >> ..\nsis.log 2>&1
          if errorlevel 1 exit /b 1
          move /y EyeLeo_Installer_*.exe ..\dist\ > nul
          dir ..\dist
          type ..\nsis.log
        shell: cmd

      - name: Upload the runnable app
        uses: actions/upload-artifact@v4
        with:
          name: EyeLeo-Windows-App
          # bin/, not the build directory: the POST_BUILD step already copies EyeLeo.exe and
          # activity-monitor.dll there, and bin/ already holds Resources/, Personages/,
          # Langpacks/ and config.xml. Every asset is loaded relative to the working directory,
          # so bin/ is the whole runnable tree and the build directory is not.
          path: bin/
          if-no-files-found: error

      # Publishing runs on the automatic GITHUB_TOKEN, so no personal token is involved. A release is
      # created for the tag if it is not there yet and reused otherwise, so re-pushing a tag does not
      # fail on an existing release.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const notes = [
              'Windows build of EyeLeo, the macOS port feature set brought back to the original.',
              '',
              'Compared with 1.3.6:',
              '',
              '- Exercises 8, 9 and 10 added; exercise 7 now animates.',
              '- The neck and shoulders exercise uses two drawn frames instead of two moved layers.',
              '- The long break cycles a full figure through four poses.',
              '- A hydration reminder, and a tea timer with manual steeps.',
              '- Russian plural forms are fixed past one hundred.',
              '',
              'Attention: the assets are loaded relative to the working directory, so the program must',
              'be started from its own folder.',
            ].join('\n');

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (err) {
              if (err.status !== 404) throw err;
              release = await github.rest.repos.createRelease({
                owner, repo, tag_name: tag,
                name: 'EyeLeo ' + tag.replace(/^v/, ''),
                body: notes,
                draft: false, prerelease: false,
              });
            }

            const files = fs.readdirSync('dist').filter(f => !fs.statSync(path.join('dist', f)).isDirectory());
            for (const f of files) {
              const assetName = f;
              const existing = release.data.assets.find(a => a.name === assetName);
              if (existing)
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.data.id,
                name: assetName, data: fs.readFileSync(path.join('dist', f)),
              });
              core.info('published ' + assetName);
            }

      # Last, so it also catches the installer step: the first version of this step ran before the
      # installers were even attempted and therefore reported nothing when they were what failed.
      #
      # Published as a commit comment because that is the one place a reader without repository admin
      # rights can reach: the job log endpoint answers 403 for them, the step summary is not exposed by
      # the API at all, and downloading an artifact needs authentication too.
      - name: Report the failure on the commit
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const parts = [];
            for (const name of ['build.log', 'nsis.log']) {
              if (!fs.existsSync(name)) continue;
              const log = fs.readFileSync(name, 'utf8');
              // The compiler's output is filtered to its error lines; makensis writes its complaints as
              // prose and the filter hid exactly the one that mattered, so its log goes in whole.
              const lines = log.split(/\r?\n/).filter(l => l.trim());
              const errors = name === 'nsis.log'
                ? lines.slice(-60)
                : log.split(/\r?\n/)
                    .filter(l => /\berror\s+[A-Z]+\d+|\bfatal error|\berror LNK/i.test(l))
                    .slice(0, 25);
              parts.push('#### ' + name + '\n\n```\n' +
                (errors.length ? errors.join('\n') : lines.slice(-25).join('\n')) + '\n```');
            }
            const body = parts.length ? parts.join('\n\n')
                                      : 'Сборка упала на шаге, вывод которого не попал в файл.';
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '### Ошибки сборки\n\n' + body
            });
