name: Build EyeLeo

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/**
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      - name: Cache wxWidgets
        id: cache-wx
        uses: actions/cache@v4
        with:
          path: C:\Dev\wxWidgets-3.1.3
          # ВНИМАНИЕ: Я изменил имя кэша (добавил -md), чтобы сбросить старую версию
          key: wxwidgets-3.1.3-msvc2022-x64-md

      - name: Download and setup wxWidgets
        if: steps.cache-wx.outputs.cache-hit != 'true'
        run: |
          mkdir C:\Dev
          curl.exe -L -o C:\Dev\wxWidgets.zip https://github.com/wxWidgets/wxWidgets/releases/download/v3.1.3/wxWidgets-3.1.3.zip
          7z x C:\Dev\wxWidgets.zip -oC:\Dev\wxWidgets-3.1.3
        shell: cmd

      - name: Build wxWidgets
        if: steps.cache-wx.outputs.cache-hit != 'true'
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd /d C:\Dev\wxWidgets-3.1.3\build\msw
          # ВНИМАНИЕ: Изменено на RUNTIME_LIBS=dynamic
          nmake -f makefile.vc BUILD=release SHARED=0 RUNTIME_LIBS=dynamic TARGET_CPU=X64
        shell: cmd

      - name: Configure and Build EyeLeo App
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set WXWIN=C:\Dev\wxWidgets-3.1.3\
          cmake -B windowsbuild . > build.log 2>&1 && cmake --build windowsbuild --config Release >> build.log 2>&1
          set RC=%ERRORLEVEL%
          type build.log
          echo "### Build output" >> %GITHUB_STEP_SUMMARY%
          type build.log >> %GITHUB_STEP_SUMMARY%
          exit /b %RC%
        shell: cmd

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      # Publishing the compiler's errors as a commit comment, because that is the one place a reader
      # without repository admin rights can reach: the job log endpoint answers 403 for them and the
      # step summary is not exposed by the API at all, and an artifact needs authentication too. Only
      # the error lines go up, so a failure is diagnosable from a plain fetch instead of only from the
      # Actions page.
      - name: Report the build errors on the commit
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('build.log', 'utf8');
            const errors = log.split(/\r?\n/)
              .filter(l => /\berror\s+[A-Z]+\d+|\bfatal error|\berror LNK/i.test(l))
              .slice(0, 40);
            const body = errors.length ? errors.join('\n') : log.split(/\r?\n/).slice(-40).join('\n');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '### Ошибки сборки\n\n```\n' + body + '\n```'
            });

      - name: Upload the runnable app
        uses: actions/upload-artifact@v4
        with:
          name: EyeLeo-Windows-App
          # bin/, not the build directory: the POST_BUILD step already copies EyeLeo.exe and
          # activity-monitor.dll there, and bin/ already holds Resources/, Personages/,
          # Langpacks/ and config.xml. Every asset is loaded relative to the working directory,
          # so bin/ is the whole runnable tree and the build directory is not.
          path: bin/
          if-no-files-found: error
